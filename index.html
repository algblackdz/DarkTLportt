<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DarKTL — Roblox GFX Artist</title>
<meta name="description" content="Portfolio of DarKTL, Roblox GFX artist.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --surface:#07100a;
  --line:rgba(60,255,130,.13);
  --green:#1cf06a;
  --green-mid:#0f9c47;
  --green-deep:#06361b;
  --text:#e8f3ec;
  --muted:#7b8e83;
  --ease:cubic-bezier(.22,1,.36,1);
  --display:'Unbounded','Arial Black','Helvetica Neue',Arial,sans-serif;
  --body:'Manrope','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}

/* custom cursor (only on fine pointers, class added by JS) */
.has-cursor, .has-cursor *{cursor:none !important}
.cur-dot,.cur-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;opacity:0;transition:opacity .3s}
.has-cursor .cur-dot,.has-cursor .cur-ring{opacity:1}
.cur-dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.cur-ring{width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:1px solid rgba(28,240,106,.55);background:rgba(0,0,0,.25);display:grid;place-items:center;
  transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .3s,border-color .3s,box-shadow .35s,opacity .3s;mix-blend-mode:normal}
.cur-ring span{font:600 11px/1 var(--body);color:#001a0a;opacity:0;transition:opacity .2s;letter-spacing:.02em}
.cur-ring[data-state="link"]{width:56px;height:56px;margin:-28px 0 0 -28px;background:rgba(28,240,106,.1);border-color:var(--green);box-shadow:0 0 28px rgba(28,240,106,.45)}
.cur-ring[data-state="nav"]{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--green);border-color:var(--green);box-shadow:0 0 18px rgba(28,240,106,.7)}
.cur-ring[data-state="media"]{width:78px;height:78px;margin:-39px 0 0 -39px;background:var(--green);border-color:var(--green);box-shadow:0 0 40px rgba(28,240,106,.5)}
.cur-ring[data-state="media"] span{opacity:1}
.cur-ring.down{transform:scale(.88)}
.cur-ring.hide,.cur-dot.hide{opacity:0 !important}

/* atmosphere */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orb.a{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:radial-gradient(circle,rgba(14,120,55,.30),transparent 68%);animation:drift 26s ease-in-out infinite alternate}
.orb.b{width:50vmax;height:50vmax;right:-18vmax;bottom:-16vmax;background:radial-gradient(circle,rgba(10,90,42,.28),transparent 68%);animation:drift 32s ease-in-out infinite alternate-reverse}
.ring-shape{position:absolute;width:70vmin;height:70vmin;right:8vw;top:12vh;border:1px solid rgba(28,240,106,.07);border-radius:50%}
.ring-shape::after{content:"";position:absolute;inset:12%;border:1px solid rgba(28,240,106,.05);border-radius:50%}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.1)}}

/* intro */
.intro{position:fixed;inset:0;z-index:10000;background:#000;display:grid;place-items:center;transition:transform 1s var(--ease) .15s;pointer-events:none}
.intro b{font:800 clamp(1.4rem,4vw,2.2rem)/1 var(--display);letter-spacing:-.03em;color:var(--green);text-shadow:0 0 30px rgba(28,240,106,.6);opacity:0;animation:introIn .6s var(--ease) .1s forwards}
@keyframes introIn{to{opacity:1}}
.ready .intro{transform:translateY(-101%)}
.ready .intro b{opacity:0;transition:opacity .25s}

/* nav */
.nav{position:fixed;left:0;right:0;top:0;z-index:100;padding:calc(env(safe-area-inset-top,0px) + 14px) clamp(16px,4vw,48px) 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  -webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.logo{font:800 1.15rem/1 var(--display);letter-spacing:-.04em;color:var(--text);padding:6px 2px}
.logo i{font-style:normal;color:var(--green);text-shadow:0 0 16px rgba(28,240,106,.6)}
.links{display:flex;gap:clamp(14px,2.4vw,34px);list-style:none;margin:0;padding:0}
.links a{position:relative;display:block;padding:8px 2px;font-size:.92rem;font-weight:500;color:var(--muted);transition:color .3s}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--green);box-shadow:0 0 10px var(--green);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.links a:hover,.links a.active{color:var(--text)}
.links a:hover::after,.links a.active::after{transform:scaleX(1)}
.nav-right{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;font-weight:600;font-size:.92rem;white-space:nowrap;will-change:transform}
.btn-ghost{padding:10px 20px;border:1px solid var(--line);background:rgba(7,16,10,.6);color:var(--text);transition:border-color .3s,box-shadow .3s,background .3s}
.btn-ghost:hover{border-color:var(--green);box-shadow:0 0 24px rgba(28,240,106,.25);background:rgba(28,240,106,.07)}
.btn-main{padding:16px 30px;background:var(--green);color:#001a0a;font-size:1rem;box-shadow:0 0 0 1px rgba(28,240,106,.4),0 10px 50px rgba(28,240,106,.28);transition:box-shadow .35s,background .3s}
.btn-main:hover{box-shadow:0 0 0 1px var(--green),0 12px 70px rgba(28,240,106,.5);background:#4dff8d}
.menu-btn{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;place-items:center;background:rgba(7,16,10,.6)}
.menu-btn span{display:block;width:16px;height:1.5px;background:var(--text);position:relative;transition:background .2s}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0;width:16px;height:1.5px;background:var(--text);transition:transform .35s var(--ease)}
.menu-btn span::before{top:-5px}.menu-btn span::after{top:5px}
.menu-open .nav{backdrop-filter:none;-webkit-backdrop-filter:none;-webkit-mask-image:none;mask-image:none}
.menu-open .menu-btn span{background:transparent}
.menu-open .menu-btn span::before{transform:translateY(5px) rotate(45deg)}
.menu-open .menu-btn span::after{transform:translateY(-5px) rotate(-45deg)}

/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:120px 20px 90px;overflow:hidden}
.hero-core{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:20px}
.name{margin:0;display:flex;font:800 clamp(3.1rem,16vw,14rem)/1 var(--display);letter-spacing:-.06em;filter:drop-shadow(0 0 42px rgba(28,240,106,.22))}
.name .l{display:block;overflow:hidden;padding:.06em .01em .1em}
.name .l span{display:block;transform:translateY(115%);background:linear-gradient(180deg,#ffffff 8%,#b9ffd5 42%,#1cf06a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ready .name .l span{transform:none;transition:transform 1.2s var(--ease);transition-delay:calc(.55s + var(--i)*.07s)}
.role{margin:0;font-size:clamp(.95rem,1.6vw,1.15rem);font-weight:500;color:var(--muted);opacity:0;transition:opacity 1s ease 1.3s}
.ready .role{opacity:1}
.hero .btn-main{opacity:0;transform:translateY(14px);transition:opacity .9s ease 1.5s,transform .9s var(--ease) 1.5s,box-shadow .35s,background .3s}
.ready .hero .btn-main{opacity:1;transform:none}
.floats{position:absolute;inset:0;z-index:1;pointer-events:none}
.fl{position:absolute;will-change:transform}
.fl-in{border-radius:6px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 50px rgba(28,240,106,.08);opacity:0;transform:scale(.92);transition:opacity 1.4s ease var(--d),transform 1.4s var(--ease) var(--d)}
.ready .fl-in{opacity:.78;transform:none}
.fl-in img{width:100%;height:100%;object-fit:cover}
.fl-bob{animation:bob 9s ease-in-out infinite alternate;animation-delay:var(--bd)}
@keyframes bob{to{transform:translateY(-14px) rotate(1deg)}}
.scroll-hint{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;width:1px;height:46px;background:linear-gradient(var(--green),transparent);z-index:3;opacity:.6;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* sections */
.section{position:relative;padding:clamp(80px,12vw,150px) clamp(16px,4vw,48px) clamp(20px,4vw,40px);max-width:1500px;margin:0 auto}
.section::before{content:"";position:absolute;left:clamp(16px,4vw,48px);right:clamp(16px,4vw,48px);top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(28,240,106,.35),transparent)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:clamp(28px,5vw,56px)}
.sec-head h2{margin:0;font:800 clamp(2.2rem,7vw,5.6rem)/1 var(--display);letter-spacing:-.05em;overflow:hidden;padding-bottom:.08em}
.sec-head h2 span{display:inline-block;transform:translateY(105%);transition:transform 1.1s var(--ease)}
.sec-head.in h2 span{transform:none}
.sec-head small{color:var(--muted);font-size:.9rem;font-weight:500;white-space:nowrap}

/* gallery layouts */
.masonry{column-count:3;column-gap:clamp(10px,1.6vw,20px)}
.masonry .card{display:block;break-inside:avoid;margin-bottom:clamp(10px,1.6vw,20px);width:100%}
.grid{display:grid;gap:clamp(10px,1.6vw,20px);align-items:start}
.grid-logos{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid-ui{grid-template-columns:repeat(2,1fr)}
.grid-concept{grid-template-columns:repeat(3,1fr)}
.grid-concept .card:first-child{grid-column:1/-1}
.grid-faces{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

.card{position:relative;margin:0;border-radius:6px;background:var(--surface);--tx:0;--ty:0}
.card .media{position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit;border:1px solid var(--line);transition:border-color .4s,box-shadow .5s;background:var(--surface)}
.card .media::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(135deg,#031208,#0a2a17);transform-origin:top;transition:transform 1.1s var(--ease);transition-delay:var(--d,0s)}
.card.in .media::before{transform:scaleY(0)}
.card img{width:100%;height:100%;object-fit:cover;opacity:0;filter:blur(14px);transform:scale(1.18);transition:opacity .8s ease,filter 1s ease,transform 1.4s var(--ease);transition-delay:var(--d,0s)}
.card.in img.loaded{opacity:1;filter:none;transform:scale(1)}
.card.in:hover img.loaded{transform:scale(1.07) translate(calc(var(--tx)*7px),calc(var(--ty)*7px));transition:transform .7s var(--ease),opacity .3s;transition-delay:0s}
.card:hover .media{border-color:rgba(28,240,106,.7);box-shadow:0 0 0 1px rgba(28,240,106,.25),0 0 46px rgba(28,240,106,.22),0 24px 60px rgba(0,0,0,.6)}
.card .cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:34px 14px 12px;font-size:.88rem;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transform:translateY(8px);transition:opacity .4s,transform .5s var(--ease);pointer-events:none}
.card:hover .cap{opacity:1;transform:none}
.card button.hit{position:absolute;inset:0;z-index:4;width:100%;height:100%}

/* contact */
.contact{text-align:center;padding-bottom:clamp(60px,9vw,110px)}
.contact h2{margin:0 auto clamp(30px,5vw,52px);font:800 clamp(2rem,6.4vw,5rem)/1.04 var(--display);letter-spacing:-.05em;max-width:12em}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.socials .btn-ghost{padding:14px 24px;font-size:.98rem}
.socials svg{width:20px;height:20px;fill:none;stroke:var(--green);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.foot{padding:30px 20px calc(36px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:.85rem}

/* lightbox */
.lb{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s .45s;touch-action:pan-y}
.lb.open{opacity:1;visibility:visible;transition:opacity .45s var(--ease)}
.lb::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(28,240,106,.10),transparent 60%);pointer-events:none}
.lb-stage{position:relative;flex:1;width:100%;min-height:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 64px) clamp(12px,7vw,110px) 12px}
.lb-img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:6px;border:1px solid var(--line);box-shadow:0 0 90px rgba(28,240,106,.18),0 40px 100px rgba(0,0,0,.8);opacity:0;transform:scale(.94);transition:opacity .4s ease,transform .6s var(--ease)}
.lb.open .lb-img.show{opacity:1;transform:none}
.lb-bar{width:100%;display:flex;justify-content:center;gap:18px;align-items:center;padding:6px 20px calc(18px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.9rem;min-height:52px}
.lb-bar b{color:var(--text);font-weight:600}
.lb-btn{position:absolute;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(7,16,10,.7);transition:border-color .3s,box-shadow .3s,background .3s;z-index:2}
.lb-btn:hover{border-color:var(--green);box-shadow:0 0 26px rgba(28,240,106,.35);background:rgba(28,240,106,.1)}
.lb-btn svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 14px);right:clamp(14px,3vw,34px)}
.lb-prev{left:clamp(8px,2vw,28px);top:50%;margin-top:-23px}
.lb-next{right:clamp(8px,2vw,28px);top:50%;margin-top:-23px}

/* reveal for generic items */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}

/* responsive */
@media (max-width:1000px){
  .masonry{column-count:2}
  .grid-concept{grid-template-columns:repeat(2,1fr)}
  .links{display:none}
  .menu-btn{display:grid}
  .menu-open .links{display:flex;position:fixed;inset:0;z-index:-1;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding:0 clamp(24px,8vw,60px);background:rgba(0,0,0,.96)}
  .menu-open .links a{font:800 clamp(1.8rem,8vw,2.8rem)/1.2 var(--display);letter-spacing:-.04em;color:var(--text);padding:8px 0}
}
@media (max-width:640px){
  .grid-ui{grid-template-columns:1fr}
  .grid-faces{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .sec-head small{display:none}
  .fl.hide-sm{display:none}
  .btn-ghost.contact-top{padding:9px 16px}
  .lb-prev,.lb-next{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);margin:0}
}
@media (max-width:460px){
  .masonry{column-count:1}
  .grid-concept{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition-duration:.01ms !important;transition-delay:0s !important}
  .name .l span{transform:none}
  .card .media::before{transform:scaleY(0)}
}
</style>
</head>

<div class="bg" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="ring-shape"></div></div>

</main>

<footer class="foot">© 2026 DarKTL</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Artwork viewer">

  <div class="lb-stage" id="lbStage"><img class="lb-img" id="lbImg" alt=""></div>
  <div class="lb-bar"><b id="lbTitle"></b><span id="lbCount"></span></div>
</div>

<script>
/* =====================================================================
   HOW TO ADD YOUR ARTWORK
   Each category below is a simple list. Add or replace entries like:
     { src: "images/gfx/my-render.png", title: "Project name", ratio: "3/4" }
   - src   : path or URL of your image. Leave it empty to show a placeholder.
   - title : shown on hover and in the fullscreen viewer (optional).
   - ratio : width/height of the image, e.g. "1/1", "16/9", "3/4", "4/5", "21/9".
   The layout adapts to any number of images.
   ===================================================================== */
const ARTWORK = {
  gfx: [
    { src:"img/naruto.png", title:"Naruto", ratio:"16/10" },  { src:"img/dark.png", title:"", ratio:"16/10" }, 
    { src:"img/midoriya.png", title:"", ratio:"5/5" },  { src:"img/ddddd2.png", title:"", ratio:"5/5" },  { src:"img/30.png", title:"", ratio:"16/10" },
  ],
  logos: [
    { src:"img/1.png", title:"", ratio:"16/10" }, { src:"img/3.png", title:"", ratio:"16/10" }, ,
    { src:"img/2.png", title:"", ratio:"16/10" }, { src:"img/4.png", title:"", ratio:"16/10" }, 
  ],
  ui: [
    { src:"img/5.png", title:"", ratio:"16/10" }, { src:"img/6.png", title:"", ratio:"16/10" }, { src:"img/7.png", title:"", ratio:"16/10" },
    
  ],
  concept: [
    { src:"img/8.png", title:"", ratio:"16/10" }, { src:"img/9.png", title:"", ratio:"16/10" }, { src:"img/10.png", title:"", ratio:"16/10" }, { src:"img/11.png", title:"", ratio:"16/10" }
  ],
  faces: [
    { src:"img/12.png", title:"", ratio:"1/1" }, { src:"img/13.png", title:"", ratio:"1/1" }, { src:"img/14.png", title:"", ratio:"1/1" }, { src:"img/15.png", title:"", ratio:"1/1" },
    { src:"", title:"", ratio:"1/1" }, { src:"", title:"", ratio:"1/1" }, { src:"", title:"", ratio:"1/1" }, { src:"", title:"", ratio:"1/1" },
    { src:"", title:"", ratio:"1/1" }, { src:"", title:"", ratio:"1/1" }, { src:"", title:"", ratio:"1/1" }, { src:"", title:"", ratio:"1/1" }
  ]
};
const CATEGORIES = [
  { id:"gfx",     title:"GFX",          kind:"gfx",     layout:"masonry" },
  { id:"logos",   title:"Logos & Text", kind:"logo",    layout:"grid grid-logos" },
  { id:"ui",      title:"UI",           kind:"ui",      layout:"grid grid-ui" },
  { id:"concept", title:"Concept Art",  kind:"concept", layout:"grid grid-concept" },
  { id:"faces",   title:"Faces",        kind:"face",    layout:"grid grid-faces" }
];

/* ---------- placeholder artwork (used only when src is empty) ---------- */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(kind, seed, ratio){
  const [a,b]=ratio.split("/").map(Number), W=1000, H=Math.round(W*b/a);
  const r=rng(seed*7919+kind.length*131+kind.charCodeAt(0)), R=(m,n)=>m+(n-m)*r();
  const G="#1cf06a";
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010302"/><stop offset="1" stop-color="#07190e"/></linearGradient>
  <radialGradient id="rg"><stop offset="0" stop-color="${G}" stop-opacity=".5"/><stop offset="1" stop-color="${G}" stop-opacity="0"/></radialGradient>
  <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dffb2"/><stop offset="1" stop-color="#0a6b32"/></linearGradient>
  <filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${W*0.014}"/></filter></defs>
  <rect width="${W}" height="${H}" fill="url(#bg)"/>`;
  if(kind==="gfx"){
    s+=`<circle cx="${R(.25,.75)*W}" cy="${R(.25,.75)*H}" r="${W*R(.4,.65)}" fill="url(#rg)"/>`;
    for(let i=0;i<7;i++){
      const cx=R(.05,.95)*W, cy=R(.05,.95)*H, z=W*R(.07,.22), rot=R(0,360);
      s+=`<polygon points="${cx},${cy-z} ${cx+z*.9},${cy+z*.6} ${cx-z*.9},${cy+z*.6}" transform="rotate(${rot} ${cx} ${cy})" fill="url(#lg)" fill-opacity="${R(.12,.55)}" stroke="${G}" stroke-opacity=".35"/>`;
    }
    const cx=W*R(.4,.6), cy=H*R(.4,.6), z=Math.min(W,H)*.26;
    const d=`${cx},${cy-z} ${cx+z*.8},${cy} ${cx},${cy+z} ${cx-z*.8},${cy}`;
    s+=`<polygon points="${d}" fill="${G}" opacity=".7" filter="url(#bl)"/><polygon points="${d}" fill="url(#lg)" stroke="#b9ffd5" stroke-width="2"/>`;
    s+=`<polygon points="${cx},${cy-z} ${cx+z*.8},${cy} ${cx},${cy}" fill="#fff" opacity=".18"/>`;
    for(let i=0;i<3;i++){const y=R(.1,.9)*H;s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y-H*R(.2,.5)}" stroke="${G}" stroke-opacity=".16" stroke-width="2"/>`}
  } else if(kind==="logo"){
    const words=["DTL","BLOX","NEON","FLUX","APEX","VOLT","ZERO"], w=words[seed%7], fs=Math.min(W*(w.length>3?.27:.4),H*.6);
    s+=`<circle cx="${W/2}" cy="${H/2}" r="${W*.45}" fill="url(#rg)" opacity=".7"/>`;
    const t=(extra)=>`<text x="${W/2}" y="${H*.56}" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="${fs}" letter-spacing="-${fs*.04}" ${extra}>${w}</text>`;
    s+=t(`fill="${G}" filter="url(#bl)" opacity=".8"`);
    s+= seed%2 ? t(`fill="url(#lg)"`) : t(`fill="none" stroke="${G}" stroke-width="4"`);
    s+=`<rect x="${W*.3}" y="${H*.72}" width="${W*.4}" height="4" fill="${G}" opacity=".7"/>`;
  } else if(kind==="ui"){
    s+=`<rect x="${W*.07}" y="${H*.09}" width="${W*.86}" height="${H*.82}" rx="${W*.025}" fill="#06100a" stroke="${G}" stroke-opacity=".4" stroke-width="2"/>`;
    s+=`<rect x="${W*.11}" y="${H*.15}" width="${W*.4}" height="${H*.06}" rx="${H*.03}" fill="#0b2a18"/><rect x="${W*.11}" y="${H*.15}" width="${W*.4*R(.4,.95)}" height="${H*.06}" rx="${H*.03}" fill="url(#lg)"/>`;
    s+=`<circle cx="${W*.86}" cy="${H*.18}" r="${H*.06}" fill="none" stroke="${G}" stroke-width="3"/>`;
    for(let i=0;i<8;i++){const x=W*(.11+(i%4)*.2), y=H*(.32+Math.floor(i/4)*.24);
      s+=`<rect x="${x}" y="${y}" width="${W*.17}" height="${H*.2}" rx="${W*.015}" fill="${i===seed%8?"#0d3a20":"#081a10"}" stroke="${G}" stroke-opacity="${i===seed%8?.9:.25}" stroke-width="2"/><circle cx="${x+W*.085}" cy="${y+H*.1}" r="${H*.04}" fill="${G}" opacity="${R(.25,.8)}"/>`;}
    s+=`<rect x="${W*.34}" y="${H*.8}" width="${W*.32}" height="${H*.07}" rx="${H*.035}" fill="${G}"/>`;
  } else if(kind==="concept"){
    s+=`<circle cx="${W*R(.2,.8)}" cy="${H*R(.18,.35)}" r="${Math.min(W,H)*.1}" fill="#c9ffe0" opacity=".9"/><circle cx="${W*.5}" cy="${H*.3}" r="${W*.4}" fill="url(#rg)" opacity=".5"/>`;
    for(let L=0;L<3;L++){
      let y0=H*(.5+L*.15), p=`M0 ${H} L0 ${y0}`;
      for(let x=0;x<=W;x+=W/9){p+=` L${x} ${y0-R(0,H*(.22-L*.05))}`}
      p+=` L${W} ${H} Z`;
      s+=`<path d="${p}" fill="${["#0b3a20","#06240f","#020d06"][L]}" stroke="${G}" stroke-opacity="${.35-L*.1}"/>`;
    }
    const fx=W*R(.3,.7), fy=H*.78, fh=Math.min(W,H)*.2;
    s+=`<circle cx="${fx}" cy="${fy-fh}" r="${fh*.16}" fill="#000" stroke="${G}"/><path d="M${fx-fh*.2} ${fy} L${fx-fh*.1} ${fy-fh*.85} L${fx+fh*.1} ${fy-fh*.85} L${fx+fh*.2} ${fy} Z" fill="#000" stroke="${G}"/>`;
  } else {
    const mouths=[
      `<path d="M300 650 Q500 820 700 650" fill="none" stroke="${G}" stroke-width="30" stroke-linecap="round"/>`,
      `<path d="M330 700 L670 700" fill="none" stroke="${G}" stroke-width="30" stroke-linecap="round"/>`,
      `<ellipse cx="500" cy="710" rx="70" ry="90" fill="none" stroke="${G}" stroke-width="28"/>`,
      `<path d="M320 700 Q500 720 690 620" fill="none" stroke="${G}" stroke-width="30" stroke-linecap="round"/>`,
      `<path d="M310 750 Q500 620 690 750" fill="none" stroke="${G}" stroke-width="30" stroke-linecap="round"/>`,
      `<path d="M290 640 Q500 880 710 640 Z" fill="${G}" fill-opacity=".15" stroke="${G}" stroke-width="26" stroke-linejoin="round"/>`
    ];
    const eyes=[
      `<ellipse cx="350" cy="430" rx="48" ry="68" fill="${G}"/><ellipse cx="650" cy="430" rx="48" ry="68" fill="${G}"/>`,
      `<path d="M290 360 L420 410" stroke="${G}" stroke-width="28" stroke-linecap="round"/><path d="M710 360 L580 410" stroke="${G}" stroke-width="28" stroke-linecap="round"/><circle cx="360" cy="470" r="38" fill="${G}"/><circle cx="640" cy="470" r="38" fill="${G}"/>`,
      `<ellipse cx="350" cy="430" rx="48" ry="68" fill="${G}"/><path d="M590 440 L710 440" stroke="${G}" stroke-width="28" stroke-linecap="round"/>`,
      `<path d="M290 450 Q350 380 410 450" fill="none" stroke="${G}" stroke-width="28" stroke-linecap="round"/><path d="M590 450 Q650 380 710 450" fill="none" stroke="${G}" stroke-width="28" stroke-linecap="round"/>`,
      `<circle cx="350" cy="430" r="70" fill="none" stroke="${G}" stroke-width="22"/><circle cx="350" cy="430" r="26" fill="${G}"/><circle cx="650" cy="430" r="70" fill="none" stroke="${G}" stroke-width="22"/><circle cx="650" cy="430" r="26" fill="${G}"/>`
    ];
    s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020604"/><stop offset="1" stop-color="#0a2314"/></linearGradient><radialGradient id="rg"><stop offset="0" stop-color="${G}" stop-opacity=".35"/><stop offset="1" stop-color="${G}" stop-opacity="0"/></radialGradient><filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="1000" height="1000" fill="url(#bg)"/><circle cx="500" cy="540" r="470" fill="url(#rg)"/>`;
    const face=eyes[(seed*3+1)%5]+mouths[seed%6];
    s+=`<g filter="url(#bl)" opacity=".8">${face}</g><g>${face}</g>`;
  }
  s+=`</svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
}

/* ---------- build galleries ---------- */
const galleries=document.getElementById("galleries");
const LIB={};
CATEGORIES.forEach(cat=>{
  const items=(ARTWORK[cat.id]||[]).map((it,i)=>{
    const ratio=it.ratio||"1/1";
    return { url: it.src || art(cat.kind,i+1,ratio), title: it.title||"", ratio };
  });
  LIB[cat.id]=items;
  const sec=document.createElement("section");
  sec.className="section"; sec.id=cat.id; sec.dataset.cat=cat.id;
  sec.innerHTML=`<div class="sec-head"><h2><span>${cat.title.replace("&","&amp;")}</span></h2><small>${items.length} works</small></div><div class="${cat.layout}"></div>`;
  const wrap=sec.querySelector(".masonry, .grid");
  items.forEach((it,i)=>{
    const f=document.createElement("figure");
    f.className="card"; f.style.aspectRatio=it.ratio; f.style.setProperty("--d",(i%4)*0.08+"s");
    f.innerHTML=`<div class="media"><img alt="${it.title||cat.title+" artwork"}" decoding="async" data-src="${it.url}">${it.title?`<figcaption class="cap">${it.title}</figcaption>`:""}</div><button class="hit" data-cursor="media" aria-label="Open ${it.title||cat.title+" artwork"}" data-cat="${cat.id}" data-i="${i}"></button>`;
    wrap.appendChild(f);
  });
  galleries.appendChild(sec);
});

/* ---------- hero floating artwork ---------- */
const FLOATS=[
  {k:"gfx",    ratio:"3/4",   x:"3%",  y:"16%", w:"clamp(90px,16vw,260px)", rot:-6, depth:.6},
  {k:"ui",     ratio:"16/10", x:"auto",r:"4%",  y:"13%", w:"clamp(120px,19vw,320px)", rot:5, depth:.9},
  {k:"face",   ratio:"1/1",   x:"11%", b:"10%", w:"clamp(80px,13vw,210px)", rot:4, depth:1.3},
  {k:"concept",ratio:"3/4",   x:"auto",r:"9%",  b:"9%",  w:"clamp(90px,15vw,250px)", rot:-4, depth:.7},
  {k:"logo",   ratio:"16/10", x:"38%", y:"5%",  w:"clamp(120px,13vw,230px)", rot:2, depth:1.6, sm:true},
  {k:"gfx",    ratio:"1/1",   x:"auto",r:"36%", b:"4%",  w:"clamp(90px,10vw,170px)", rot:-3, depth:1.1, sm:true}
];
const floats=document.getElementById("floats");
FLOATS.forEach((f,i)=>{
  const src=(LIB[{gfx:"gfx",ui:"ui",face:"faces",concept:"concept",logo:"logos"}[f.k]]||[])[ (i+1) % 3 ];
  const url=src && src.url ? src.url : art(f.k,i+11,f.ratio);
  const el=document.createElement("div");
  el.className="fl"+(f.sm?" hide-sm":""); el.dataset.depth=f.depth;
  el.style.cssText=`${f.r?`right:${f.r};`:`left:${f.x};`}${f.b?`bottom:${f.b};`:`top:${f.y};`}width:${f.w};aspect-ratio:${f.ratio}`;
  el.innerHTML=`<div class="fl-bob" style="--bd:${-i*1.7}s;width:100%;height:100%"><div class="fl-in" style="--d:${.9+i*.12}s;width:100%;height:100%;transform:rotate(${f.rot}deg)"><img src="${art(f.k,i+11,f.ratio)}" alt=""></div></div>`;
  floats.appendChild(el);
});

/* ---------- lazy load + reveal ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const loader=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return;
  const img=e.target; loader.unobserve(img);
  img.onload=()=>img.classList.add("loaded");
  img.onerror=()=>img.classList.add("loaded");
  img.src=img.dataset.src;
}),{rootMargin:"400px 0px"});
document.querySelectorAll(".card img").forEach(i=>loader.observe(i));
const reveal=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");reveal.unobserve(e.target)}
}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
document.querySelectorAll(".card,.sec-head,.rv").forEach(el=>reveal.observe(el));

/* ---------- nav: active section, mobile menu ---------- */
const navLinks=[...document.querySelectorAll(".links a")];
const spy=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){navLinks.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+e.target.id))}
}),{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll(".section[data-cat]").forEach(s=>spy.observe(s));
const menuBtn=document.getElementById("menuBtn");
function setMenu(open){document.body.classList.toggle("menu-open",open);menuBtn.setAttribute("aria-expanded",open)}
menuBtn.addEventListener("click",()=>setMenu(!document.body.classList.contains("menu-open")));
navLinks.forEach(a=>a.addEventListener("click",()=>setMenu(false)));
document.querySelector(".contact-top").addEventListener("click",()=>setMenu(false));

/* ---------- lightbox ---------- */
const lb=document.getElementById("lb"), lbImg=document.getElementById("lbImg"), lbTitle=document.getElementById("lbTitle"), lbCount=document.getElementById("lbCount");
let cur={cat:null,i:0}, lastFocus=null;
function show(i){
  const list=LIB[cur.cat]; cur.i=(i+list.length)%list.length; const it=list[cur.i];
  lbImg.classList.remove("show");
  setTimeout(()=>{
    lbImg.onload=()=>lbImg.classList.add("show");
    lbImg.src=it.url; lbImg.alt=it.title||"Artwork";
    if(lbImg.complete) lbImg.classList.add("show");
  }, reduce?0:180);
  lbTitle.textContent=it.title; lbCount.textContent=(cur.i+1)+" / "+list.length;
}
function openLb(cat,i){lastFocus=document.activeElement;cur.cat=cat;lb.classList.add("open");document.body.style.overflow="hidden";show(i);document.getElementById("lbClose").focus()}
function closeLb(){lb.classList.remove("open");lbImg.classList.remove("show");document.body.style.overflow="";if(lastFocus)lastFocus.focus()}
document.addEventListener("click",e=>{
  const b=e.target.closest("button.hit"); if(b) openLb(b.dataset.cat,+b.dataset.i);
});
document.getElementById("lbClose").addEventListener("click",closeLb);
document.getElementById("lbPrev").addEventListener("click",()=>show(cur.i-1));
document.getElementById("lbNext").addEventListener("click",()=>show(cur.i+1));
lb.addEventListener("click",e=>{if(e.target===lb||e.target.id==="lbStage")closeLb()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(lb.classList.contains("open")) closeLb(); else setMenu(false); }
  if(!lb.classList.contains("open")) return;
  if(e.key==="ArrowLeft") show(cur.i-1);
  if(e.key==="ArrowRight") show(cur.i+1);
  if(e.key==="Tab"){
    const f=[...lb.querySelectorAll("button")], first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
let sx=null;
lb.addEventListener("pointerdown",e=>{sx=e.clientX});
lb.addEventListener("pointerup",e=>{ if(sx===null)return; const d=e.clientX-sx; sx=null; if(Math.abs(d)>60) show(cur.i+(d<0?1:-1)); });

/* ---------- cursor, magnetic buttons, parallax (one rAF loop) ---------- */
const fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
let mx=innerWidth/2, my=innerHeight/2, dx=mx, dy=my, rx=mx, ry=my;
const dot=document.querySelector(".cur-dot"), ring=document.querySelector(".cur-ring");
const magnets=[...document.querySelectorAll("[data-magnet]")].map(el=>({el,s:+el.dataset.magnet,x:0,y:0,tx:0,ty:0}));
const fls=[...document.querySelectorAll(".fl")];
let scrollY=0;
if(fine){
  document.documentElement.classList.add("has-cursor");
  addEventListener("pointermove",e=>{
    mx=e.clientX; my=e.clientY;
    const t=e.target.closest("[data-cursor]");
    ring.dataset.state=t?t.dataset.cursor:"";
    const c=e.target.closest(".card");
    if(c){const r=c.getBoundingClientRect();c.style.setProperty("--tx",((mx-r.left)/r.width-.5)*2);c.style.setProperty("--ty",((my-r.top)/r.height-.5)*2)}
    magnets.forEach(m=>{
      const r=m.el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
      const near=Math.hypot(mx-cx,my-cy) < Math.max(r.width,r.height)/2+60;
      m.tx=near?(mx-cx)*m.s:0; m.ty=near?(my-cy)*m.s:0;
    });
  },{passive:true});
  addEventListener("pointerdown",()=>ring.classList.add("down"));
  addEventListener("pointerup",()=>ring.classList.remove("down"));
  document.addEventListener("mouseleave",()=>{dot.classList.add("hide");ring.classList.add("hide")});
  document.addEventListener("mouseenter",()=>{dot.classList.remove("hide");ring.classList.remove("hide")});
}
addEventListener("scroll",()=>{scrollY=window.scrollY},{passive:true});
function frame(){
  if(fine){
    dx+=(mx-dx)*.55; dy+=(my-dy)*.55; rx+=(mx-rx)*.15; ry+=(my-ry)*.15;
    dot.style.transform=`translate3d(${dx}px,${dy}px,0)`;
    ring.style.transform=`translate3d(${rx}px,${ry}px,0)${ring.classList.contains("down")?" scale(.88)":""}`;
    magnets.forEach(m=>{
      m.x+=(m.tx-m.x)*.18; m.y+=(m.ty-m.y)*.18;
      m.el.style.translate=(Math.abs(m.x)+Math.abs(m.y)<.05)?"":`${m.x}px ${m.y}px`;
    });
  }
  if(!reduce && scrollY<innerHeight*1.4){
    const px=(mx/innerWidth-.5)*2, py=(my/innerHeight-.5)*2;
    fls.forEach(f=>{
      const d=+f.dataset.depth;
      f.style.transform=`translate3d(${-px*d*14}px,${-py*d*10 - scrollY*d*.12}px,0)`;
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- entrance ---------- */
addEventListener("load",()=>setTimeout(()=>document.body.classList.add("ready"),reduce?0:350));
setTimeout(()=>document.body.classList.add("ready"),2500);
ratio:"10/3"
window.onbeforeunload = function () {
    window.scrollTo(0, 0);
};
</script>
